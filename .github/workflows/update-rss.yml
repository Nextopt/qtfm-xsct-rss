name: Update QTFM RSS

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate RSS
        run: |
          python generate_rss.py

      - name: Commit RSS
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add podcast.xml
          git commit -m "Update podcast RSS" || echo "No changes"
          git push
